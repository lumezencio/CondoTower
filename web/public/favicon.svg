<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- círculo com gradiente -->
  <circle cx="128" cy="128" r="116" fill="url(#g)" />
  <!-- base "gramado" -->
  <ellipse cx="128" cy="188" rx="88" ry="18" fill="#ffffff22"/>
  <!-- prédio (condomínio) com sombra -->
  <g filter="url(#s)">
    <rect x="64" y="72" width="56" height="112" rx="10" fill="#fff" opacity=".95"/>
    <rect x="136" y="92" width="56" height="92" rx="10" fill="#fff" opacity=".95"/>
    <!-- janelas -->
    <g fill="#a1a1aa">
      <rect x="78" y="88" width="28" height="10" rx="3"/>
      <rect x="78" y="108" width="28" height="10" rx="3"/>
      <rect x="78" y="128" width="28" height="10" rx="3"/>
      <rect x="78" y="148" width="28" height="10" rx="3"/>
      <rect x="78" y="168" width="28" height="10" rx="3"/>
      <rect x="150" y="108" width="28" height="10" rx="3"/>
      <rect x="150" y="128" width="28" height="10" rx="3"/>
      <rect x="150" y="148" width="28" height="10" rx="3"/>
      <rect x="150" y="168" width="28" height="10" rx="3"/>
    </g>
    <!-- portas -->
    <rect x="94"  y="158" width="16" height="26" rx="3" fill="#0ea5e9"/>
    <rect x="166" y="158" width="16" height="26" rx="3" fill="#4f46e5"/>
  </g>
</svg>
