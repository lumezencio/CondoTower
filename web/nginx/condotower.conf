# ============================================
# Nginx — CondoTower + Park Club (mesma VPS)
# ============================================
# Este arquivo substitui o nginx.conf do parkclub
# para rotear AMBOS os domínios na mesma porta 80/443.
#
# condominioparkclub.com.br → Django (parkclub_web:8000)
# condotower.com.br → Next.js (condotower_web:3000)
# ============================================

# --- Upstreams ---
upstream django {
    server parkclub_web:8000;
}

upstream nextjs {
    server condotower_web:3000;
}

# ============================================
# PARK CLUB — condominioparkclub.com.br
# ============================================

server {
    listen 80;
    server_name condominioparkclub.com.br www.condominioparkclub.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name condominioparkclub.com.br www.condominioparkclub.com.br;

    ssl_certificate /etc/letsencrypt/live/condominioparkclub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condominioparkclub.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ============================================
# CONDOTOWER — condotower.com.br
# ============================================

server {
    listen 80;
    server_name condotower.com.br www.condotower.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name condotower.com.br www.condotower.com.br;

    ssl_certificate /etc/letsencrypt/live/condotower.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condotower.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para assets estáticos do Next.js
    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
